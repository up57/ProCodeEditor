<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Code Editor · Resizable + Themes</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        /* ========== THEME VARIABLES ========== */
        :root {
            --bg-body: #12121c;
            --bg-header: #0e0e16;
            --bg-panel: #15152a;
            --bg-editor: #0d0d18;
            --bg-tabs: #0f0f1a;
            --bg-preview-wrapper: #1a1a2e;
            --border-color: #2a2a48;
            --text-primary: #e4e6f0;
            --text-secondary: #8a8ab0;
            --text-muted: #5a5a7a;
            --accent-html: #ff6b6b;
            --accent-css: #4ecdc4;
            --accent-js: #f7df1e;
            --btn-bg: #2a2a4a;
            --btn-border: #4a4a7a;
            --btn-hover: #3d3d6a;
            --scroll-thumb: #3a3a5a;
            --scroll-track: #1a1a2a;
            --shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            --resizer-bg: #2a2a48;
            --resizer-hover: #6c7bff;
        }

        .light-theme {
            --bg-body: #f0f2f5;
            --bg-header: #ffffff;
            --bg-panel: #ffffff;
            --bg-editor: #fafafa;
            --bg-tabs: #f5f5f5;
            --bg-preview-wrapper: #e8eaed;
            --border-color: #d0d0d8;
            --text-primary: #1a1a2e;
            --text-secondary: #5a5a7a;
            --text-muted: #9a9aaa;
            --accent-html: #e03e3e;
            --accent-css: #0e8a7a;
            --accent-js: #c9a800;
            --btn-bg: #e0e0e8;
            --btn-border: #b0b0c0;
            --btn-hover: #d0d0d8;
            --scroll-thumb: #b0b0c0;
            --scroll-track: #e8e8f0;
            --shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            --resizer-bg: #c0c0d0;
            --resizer-hover: #6c7bff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg-body);
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            color: var(--text-primary);
            overflow: hidden;
            transition: background 0.3s, color 0.3s;
        }

        /* ========== HEADER ========== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.65rem 1.2rem;
            background: var(--bg-header);
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: 8px;
            transition: background 0.3s, border-color 0.3s;
        }

        .header h1 {
            font-size: 1.15rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, var(--accent-html), var(--accent-css));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header h1 i {
            -webkit-text-fill-color: var(--accent-html);
            font-size: 1.2rem;
        }

        .header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn {
            background: var(--btn-bg);
            color: var(--text-primary);
            border: 1px solid var(--btn-border);
            padding: 0.55rem 1.1rem;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: 0.2s ease;
            font-family: inherit;
            white-space: nowrap;
        }

        .btn:hover {
            background: var(--btn-hover);
            border-color: var(--resizer-hover);
            transform: scale(1.02);
        }

        .btn i { font-size: 1rem; }

        #themeToggle {
            border-radius: 50%;
            padding: 0.55rem;
            width: 40px;
            height: 40px;
            justify-content: center;
        }

        /* ========== MAIN LAYOUT ========== */
        .main-container {
            display: flex;
            flex: 1;
            min-height: 0;
            padding: 0.65rem;
            gap: 0;
            background: var(--bg-body);
            transition: background 0.3s;
        }

        /* ----- EDITOR PANEL ----- */
        .editor-panel {
            display: flex;
            flex-direction: column;
            background: var(--bg-panel);
            border-radius: 14px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: background 0.3s, border-color 0.3s;
            width: calc(50% - 12px);
            min-width: 220px;
            flex-shrink: 0;
        }

        /* Resizer bar */
        .resizer {
            width: 12px;
            cursor: col-resize;
            background: var(--resizer-bg);
            margin: 0 6px;
            border-radius: 6px;
            flex-shrink: 0;
            transition: background 0.2s;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        .resizer:hover,
        .resizer.active {
            background: var(--resizer-hover);
        }

        .resizer::after {
            content: "⋮";
            color: var(--text-muted);
            font-size: 18px;
            line-height: 1;
            pointer-events: none;
        }

        .resizer:hover::after { color: #ffffff; }

        /* ----- TABS ----- */
        .tabs {
            display: flex;
            background: var(--bg-tabs);
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            gap: 2px;
            transition: background 0.3s, border-color 0.3s;
        }

        .tab-btn {
            flex: 1;
            padding: 0.7rem 0.5rem;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: 0.2s;
            border-bottom: 3px solid transparent;
            font-family: inherit;
        }

        .tab-btn i { font-size: 1rem; }

        .tab-btn[data-tab="html"] { color: var(--accent-html); }
        .tab-btn[data-tab="html"]:hover { background: rgba(255, 107, 107, 0.1); }
        .tab-btn[data-tab="html"].active {
            color: var(--accent-html);
            border-bottom-color: var(--accent-html);
            background: rgba(255, 107, 107, 0.08);
        }

        .tab-btn[data-tab="css"] { color: var(--accent-css); }
        .tab-btn[data-tab="css"]:hover { background: rgba(78, 205, 196, 0.1); }
        .tab-btn[data-tab="css"].active {
            color: var(--accent-css);
            border-bottom-color: var(--accent-css);
            background: rgba(78, 205, 196, 0.08);
        }

        .tab-btn[data-tab="js"] { color: var(--accent-js); }
        .tab-btn[data-tab="js"]:hover { background: rgba(247, 223, 30, 0.1); }
        .tab-btn[data-tab="js"].active {
            color: var(--accent-js);
            border-bottom-color: var(--accent-js);
            background: rgba(247, 223, 30, 0.08);
        }

        .editor-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: var(--bg-editor);
            transition: background 0.3s;
        }

        .code-textarea {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            padding: 1rem;
            background: var(--bg-editor);
            border: none;
            color: var(--text-primary);
            font-family: 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
            font-size: 0.88rem;
            line-height: 1.6;
            resize: none;
            outline: none;
            tab-size: 2;
            overflow: auto;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.15s ease, visibility 0.15s, background 0.3s, color 0.3s;
        }

        .code-textarea.active {
            opacity: 1;
            visibility: visible;
            z-index: 2;
        }

        .code-textarea::placeholder {
            color: var(--text-muted);
            font-style: italic;
        }

        /* ----- PREVIEW PANEL ----- */
        .preview-panel {
            flex: 1;
            min-width: 200px;
            background: var(--bg-panel);
            border-radius: 14px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: background 0.3s, border-color 0.3s;
        }

        .preview-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.45rem 0.7rem;
            background: var(--bg-tabs);
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: 6px;
            transition: background 0.3s, border-color 0.3s;
        }

        .preview-header .title {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: var(--text-secondary);
        }

        .device-btns {
            display: flex;
            gap: 3px;
            background: var(--bg-body);
            border-radius: 30px;
            padding: 3px;
            border: 1px solid var(--border-color);
            transition: background 0.3s, border-color 0.3s;
        }

        .device-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
            font-family: inherit;
            white-space: nowrap;
        }

        .device-btn i { font-size: 0.7rem; }
        .device-btn:hover { color: var(--text-primary); background: var(--btn-bg); }
        .device-btn.active { background: var(--btn-hover); color: #ffffff; }

        /* ============================================
           PREVIEW WRAPPER — top-aligned so frame
           always appears at the top (no scroll down)
           ============================================ */
        .preview-wrapper {
            flex: 1;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            background: var(--bg-preview-wrapper);
            padding: 8px;
            overflow: auto;
            transition: background 0.3s;
        }

        .frame-container {
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            transition: width 0.25s ease, height 0.25s ease, border-radius 0.25s ease, border-color 0.3s;
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            min-width: 150px;
            min-height: 100px;
            flex-shrink: 0;
        }

        .frame-container.desktop {
            width: 100%;
            height: 100%;
            border-radius: 8px;
        }

        /* Tablet — original size */
        .frame-container.tablet {
            width: 768px;
            height: 90%;
            max-height: 1024px;
            border-radius: 18px;
            border: 6px solid var(--border-color);
            box-shadow: 0 0 0 3px var(--bg-preview-wrapper), 0 15px 40px rgba(0, 0, 0, 0.7);
        }

        /* Mobile — original size */
        .frame-container.mobile {
            width: 375px;
            height: 80%;
            max-height: 812px;
            border-radius: 28px;
            border: 8px solid var(--border-color);
            box-shadow: 0 0 0 3px var(--bg-preview-wrapper), 0 20px 40px rgba(0, 0, 0, 0.8);
        }

        .frame-container iframe {
            flex: 1;
            width: 100%;
            border: none;
            background: #ffffff;
        }

        /* ========== SCROLLBAR ========== */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--scroll-track); }
        ::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 8px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--resizer-hover); }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 850px) {
            .main-container {
                flex-direction: column;
            }

            .editor-panel {
                width: 100% !important;
                min-height: 180px;
                flex-shrink: 0;
            }

            .resizer {
                width: 100%;
                height: 12px;
                cursor: row-resize;
                margin: 6px 0;
            }

            .resizer::after { content: "⋯"; }

            .preview-panel { min-height: 220px; }

            .frame-container.tablet {
                width: 95%;
                max-width: 768px;
                height: 90%;
            }

            .frame-container.mobile {
                width: 95%;
                max-width: 375px;
                height: 90%;
            }
        }

        @media (max-width: 550px) {
            .header h1 { font-size: 0.9rem; }
            .btn { padding: 0.4rem 0.8rem; font-size: 0.75rem; }
            .tab-btn { font-size: 0.75rem; padding: 0.55rem 0.2rem; gap: 4px; }
            .tab-btn i { font-size: 0.8rem; }
            .device-btn { font-size: 0.6rem; padding: 0.15rem 0.4rem; }
            .device-btn i { font-size: 0.6rem; }
            .preview-header .title { font-size: 0.7rem; }
        }

        /* Prevent text selection during drag */
        .resizing-active {
            user-select: none;
            cursor: col-resize;
        }
        .resizing-active-vertical {
            user-select: none;
            cursor: row-resize;
        }
    </style>
</head>
<body class="light-theme">
    <!-- ===== HEADER ===== -->
    <header class="header">
        <h1><i class="fas fa-code"></i> Pro Code Editor</h1>
        <div class="header-actions">
            <button class="btn" id="themeToggle" title="Toggle dark/light theme">
                <i class="fas fa-sun" id="themeIcon"></i>
            </button>
            <button class="btn" id="downloadBtn">
                <i class="fas fa-file-archive"></i> Download ZIP
            </button>
        </div>
    </header>

    <!-- ===== MAIN ===== -->
    <div class="main-container" id="mainContainer">
        <!-- LEFT: Editor -->
        <div class="editor-panel" id="editorPanel">
            <div class="tabs">
                <button class="tab-btn active" data-tab="html" id="tabHtml">
                    <i class="fab fa-html5"></i> HTML
                </button>
                <button class="tab-btn" data-tab="css" id="tabCss">
                    <i class="fab fa-css3-alt"></i> CSS
                </button>
                <button class="tab-btn" data-tab="js" id="tabJs">
                    <i class="fab fa-js"></i> JS
                </button>
            </div>
            <div class="editor-container">
                <textarea id="htmlCode" class="code-textarea active" placeholder="Write HTML here..." spellcheck="false"></textarea>
                <textarea id="cssCode" class="code-textarea" placeholder="Write CSS here..." spellcheck="false"></textarea>
                <textarea id="jsCode" class="code-textarea" placeholder="Write JavaScript here..." spellcheck="false"></textarea>
            </div>
        </div>

        <!-- RESIZER -->
        <div class="resizer" id="resizer"></div>

        <!-- RIGHT: Preview -->
        <div class="preview-panel" id="previewPanel">
            <div class="preview-header">
                <div class="title">
                    <i class="fas fa-eye"></i> Preview
                </div>
                <div class="device-btns">
                    <button class="device-btn active" data-device="desktop" id="btnDesktop">
                        <i class="fas fa-desktop"></i> Desktop
                    </button>
                    <button class="device-btn" data-device="tablet" id="btnTablet">
                        <i class="fas fa-tablet-alt"></i> Tablet
                    </button>
                    <button class="device-btn" data-device="mobile" id="btnMobile">
                        <i class="fas fa-mobile-alt"></i> Mobile
                    </button>
                </div>
            </div>
            <div class="preview-wrapper" id="previewWrapper">
                <div class="frame-container desktop" id="frameContainer">
                    <iframe id="previewFrame" title="Live Preview"></iframe>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== JAVASCRIPT ===== -->
    <script>
        (function() {
            // ----- DOM refs -----
            const htmlCode = document.getElementById('htmlCode');
            const cssCode = document.getElementById('cssCode');
            const jsCode = document.getElementById('jsCode');
            const previewFrame = document.getElementById('previewFrame');
            const downloadBtn = document.getElementById('downloadBtn');
            const themeToggle = document.getElementById('themeToggle');
            const themeIcon = document.getElementById('themeIcon');
            const mainContainer = document.getElementById('mainContainer');
            const editorPanel = document.getElementById('editorPanel');
            const resizer = document.getElementById('resizer');
            const previewPanel = document.getElementById('previewPanel');
            const frameContainer = document.getElementById('frameContainer');
            const previewWrapper = document.getElementById('previewWrapper');

            const tabHtml = document.getElementById('tabHtml');
            const tabCss = document.getElementById('tabCss');
            const tabJs = document.getElementById('tabJs');
            const allTabs = [tabHtml, tabCss, tabJs];

            const btnDesktop = document.getElementById('btnDesktop');
            const btnTablet = document.getElementById('btnTablet');
            const btnMobile = document.getElementById('btnMobile');
            const allDeviceBtns = [btnDesktop, btnTablet, btnMobile];

            // Start in LIGHT theme
            let currentTheme = 'light';

            // ===== 1. TAB SWITCHING =====
            function activateTab(tabName) {
                allTabs.forEach(btn => btn.classList.toggle('active', btn.dataset.tab === tabName));
                const textareas = { html: htmlCode, css: cssCode, js: jsCode };
                Object.keys(textareas).forEach(key => {
                    textareas[key].classList.toggle('active', key === tabName);
                });
            }
            tabHtml.addEventListener('click', () => activateTab('html'));
            tabCss.addEventListener('click', () => activateTab('css'));
            tabJs.addEventListener('click', () => activateTab('js'));

            // ===== 2. DEVICE SWITCHING =====
            function setDevice(device) {
                allDeviceBtns.forEach(btn => btn.classList.toggle('active', btn.dataset.device === device));
                frameContainer.classList.remove('desktop', 'tablet', 'mobile');
                frameContainer.classList.add(device);
                previewWrapper.scrollTop = 0;
            }
            btnDesktop.addEventListener('click', () => setDevice('desktop'));
            btnTablet.addEventListener('click', () => setDevice('tablet'));
            btnMobile.addEventListener('click', () => setDevice('mobile'));

            // ===== 3. PREVIEW BUILD =====
            function buildPreviewHTML() {
                const html = htmlCode.value;
                const css = cssCode.value;
                const js = jsCode.value;

                // When everything is empty, show a friendly placeholder
                if (html.trim() === '' && css.trim() === '' && js.trim() === '') {
                    return `<!DOCTYPE html><html><head><meta charset="UTF-8"></head>
<body style="margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:#fafafa;font-family:'Segoe UI',sans-serif;color:#9a9aaa;text-align:center;">
  <div><div style="font-size:2rem;margin-bottom:8px;">✨</div><p>Start writing HTML, CSS or JS…</p></div>
</body></html>`;
                }

                if (html.trim() === '') {
                    return `<!DOCTYPE html><html><head><meta charset="UTF-8"><style>${css}</style></head>
<body style="background:#f0f0f0;display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;color:#666;">
  <p>✨ Start writing HTML...</p><script>${js}<\/script></body></html>`;
                }

                const isFullDoc = /<html/i.test(html) || /<!DOCTYPE/i.test(html);

                if (isFullDoc) {
                    let result = html;
                    if (css.trim() !== '') {
                        if (/<\/head>/i.test(result)) {
                            result = result.replace(/<\/head>/i, `<style>${css}</style></head>`);
                        } else if (/<body/i.test(result)) {
                            result = result.replace(/<body/i, `<style>${css}</style><body`);
                        } else {
                            result = `<style>${css}</style>` + result;
                        }
                    }
                    if (js.trim() !== '') {
                        if (/<\/body>/i.test(result)) {
                            result = result.replace(/<\/body>/i, `<script>${js}<\/script></body>`);
                        } else {
                            result = result + `<script>${js}<\/script>`;
                        }
                    }
                    return result;
                } else {
                    return `<!DOCTYPE html><html><head><meta charset="UTF-8"><style>${css}</style></head>
<body>${html}<script>${js}<\/script></body></html>`;
                }
            }

            function debounce(func, delay = 250) {
                let timer;
                return function(...args) {
                    clearTimeout(timer);
                    timer = setTimeout(() => func.apply(this, args), delay);
                };
            }

            function updatePreview() {
                try {
                    previewFrame.srcdoc = buildPreviewHTML();
                } catch (e) {
                    previewFrame.srcdoc = `<html><body style="background:#fdd;color:#a00;padding:1rem;font-family:monospace;"><h3>⚠️ Preview error</h3><pre>${e.message}</pre></body></html>`;
                }
            }

            const debouncedUpdate = debounce(updatePreview, 250);
            htmlCode.addEventListener('input', debouncedUpdate);
            cssCode.addEventListener('input', debouncedUpdate);
            jsCode.addEventListener('input', debouncedUpdate);
            updatePreview();

            // ===== 4. RESIZER LOGIC =====
            let isResizing = false;
            let startPos = 0;
            let startSize = 0;
            let isVertical = false;

            function checkVertical() {
                return window.innerWidth <= 850;
            }

            function initEditorWidth() {
                const containerRect = mainContainer.getBoundingClientRect();
                if (checkVertical()) {
                    editorPanel.style.width = '100%';
                    editorPanel.style.height = '50%';
                } else {
                    const w = Math.floor(containerRect.width * 0.5) - 12;
                    editorPanel.style.width = w + 'px';
                    editorPanel.style.height = '';
                }
            }

            initEditorWidth();

            resizer.addEventListener('mousedown', function(e) {
                e.preventDefault();
                e.stopPropagation();
                isResizing = true;
                isVertical = checkVertical();

                if (isVertical) {
                    startPos = e.clientY;
                    startSize = editorPanel.getBoundingClientRect().height;
                    resizer.classList.add('active');
                    document.body.classList.add('resizing-active-vertical');
                } else {
                    startPos = e.clientX;
                    startSize = editorPanel.getBoundingClientRect().width;
                    resizer.classList.add('active');
                    document.body.classList.add('resizing-active');
                }

                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
            });

            function onMouseMove(e) {
                if (!isResizing) return;
                e.preventDefault();

                const containerRect = mainContainer.getBoundingClientRect();

                if (isVertical) {
                    const delta = e.clientY - startPos;
                    let newHeight = startSize + delta;
                    const minH = 120;
                    const maxH = containerRect.height - 140;
                    newHeight = Math.max(minH, Math.min(maxH, newHeight));
                    const percent = (newHeight / containerRect.height) * 100;
                    editorPanel.style.height = percent + '%';
                    editorPanel.style.width = '100%';
                } else {
                    const delta = e.clientX - startPos;
                    let newWidth = startSize + delta;
                    const minW = 200;
                    const maxW = containerRect.width - 220;
                    newWidth = Math.max(minW, Math.min(maxW, newWidth));
                    editorPanel.style.width = newWidth + 'px';
                    editorPanel.style.height = '';
                }
            }

            function onMouseUp() {
                if (!isResizing) return;
                isResizing = false;
                resizer.classList.remove('active');
                document.body.classList.remove('resizing-active', 'resizing-active-vertical');
                document.removeEventListener('mousemove', onMouseMove);
                document.removeEventListener('mouseup', onMouseUp);
            }

            // Touch support
            resizer.addEventListener('touchstart', function(e) {
                e.preventDefault();
                isResizing = true;
                isVertical = checkVertical();
                const touch = e.touches[0];

                if (isVertical) {
                    startPos = touch.clientY;
                    startSize = editorPanel.getBoundingClientRect().height;
                } else {
                    startPos = touch.clientX;
                    startSize = editorPanel.getBoundingClientRect().width;
                }
                resizer.classList.add('active');
                document.addEventListener('touchmove', onTouchMove, { passive: false });
                document.addEventListener('touchend', onTouchEnd);
            }, { passive: false });

            function onTouchMove(e) {
                if (!isResizing) return;
                e.preventDefault();
                const touch = e.touches[0];
                const containerRect = mainContainer.getBoundingClientRect();

                if (isVertical) {
                    const delta = touch.clientY - startPos;
                    let newHeight = startSize + delta;
                    newHeight = Math.max(120, Math.min(containerRect.height - 140, newHeight));
                    editorPanel.style.height = ((newHeight / containerRect.height) * 100) + '%';
                    editorPanel.style.width = '100%';
                } else {
                    const delta = touch.clientX - startPos;
                    let newWidth = startSize + delta;
                    newWidth = Math.max(200, Math.min(containerRect.width - 220, newWidth));
                    editorPanel.style.width = newWidth + 'px';
                }
            }

            function onTouchEnd() {
                isResizing = false;
                resizer.classList.remove('active');
                document.removeEventListener('touchmove', onTouchMove);
                document.removeEventListener('touchend', onTouchEnd);
            }

            let wasVertical = checkVertical();
            window.addEventListener('resize', function() {
                const nowVertical = checkVertical();
                if (nowVertical !== wasVertical) {
                    wasVertical = nowVertical;
                    initEditorWidth();
                }
            });

            // ===== 5. THEME TOGGLE =====
            themeToggle.addEventListener('click', () => {
                if (currentTheme === 'light') {
                    document.body.classList.remove('light-theme');
                    themeIcon.className = 'fas fa-moon';
                    currentTheme = 'dark';
                } else {
                    document.body.classList.add('light-theme');
                    themeIcon.className = 'fas fa-sun';
                    currentTheme = 'light';
                }
            });

            // ===== 6. DOWNLOAD ZIP =====
            downloadBtn.addEventListener('click', async function() {
                const zip = new JSZip();
                zip.file('index.html', htmlCode.value);
                zip.file('style.css', cssCode.value);
                zip.file('script.js', jsCode.value);
                zip.file('README.txt', `Generated with Pro Code Editor\nTheme: ${currentTheme}\n`);

                try {
                    const blob = await zip.generateAsync({ type: 'blob' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'pro-code-editor.zip';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                } catch (error) {
                    alert('Error creating ZIP: ' + error.message);
                }
            });

        })();
    </script>
</body>
</html>
